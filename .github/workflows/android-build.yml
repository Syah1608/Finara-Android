name: Build Finara APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Finara-Android-Project.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q Finara-Android-Project.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/Finara" >> "$GITHUB_ENV"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finara-debug-APK
          path: extracted/Finara/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
